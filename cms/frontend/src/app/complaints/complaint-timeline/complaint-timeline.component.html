<div class="timeline">
  @for (entry of history; track entry.id) {
    <div class="timeline-item">
      <div class="dot"></div>
      <div class="content">
        <div class="status-line">
          @if (entry.from_status) { <span class="from">{{ entry.from_status }}</span> <span>→</span> }
          <span class="to">{{ entry.to_status }}</span>
        </div>
        <div class="meta">{{ entry.actor_name }} · {{ entry.created_at | date: 'medium' }}</div>
        @if (entry.remarks) { <div class="remarks">{{ entry.remarks }}</div> }
      </div>
    </div>
  } @empty {
    <p>No activity yet.</p>
  }
</div>
