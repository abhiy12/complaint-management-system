<h1>New Executive</h1>
<mat-card class="form-card">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid-2">
      <mat-form-field appearance="outline"><mat-label>Full Name</mat-label><input matInput formControlName="name" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Employee ID</mat-label><input matInput formControlName="employeeId" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput formControlName="email" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Phone</mat-label><input matInput formControlName="phone" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Zone</mat-label><input matInput formControlName="zone" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Department</mat-label><input matInput formControlName="department" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Vehicle Number</mat-label><input matInput formControlName="vehicleNumber" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Experience (years)</mat-label><input matInput type="number" formControlName="experienceYears" /></mat-form-field>
    </div>
    <mat-form-field appearance="outline" class="full-width"><mat-label>Skills</mat-label><input matInput formControlName="skills" /></mat-form-field>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">Save Executive</button>
    <p class="hint">A temporary password is generated and would be emailed to the executive in production.</p>
  </form>
</mat-card>
