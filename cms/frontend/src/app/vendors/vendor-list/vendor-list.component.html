<div class="header-row">
  <h1>Vendors</h1>
  <a mat-flat-button color="primary" routerLink="/admin/vendors/new">+ New Vendor</a>
</div>

<table mat-table [dataSource]="vendors()" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="vendor_code">
    <th mat-header-cell *matHeaderCellDef>Code</th>
    <td mat-cell *matCellDef="let v">{{ v.vendor_code }}</td>
  </ng-container>
  <ng-container matColumnDef="vendor_name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let v">{{ v.vendor_name }}</td>
  </ng-container>
  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>City</th>
    <td mat-cell *matCellDef="let v">{{ v.city }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let v">{{ v.email }}</td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let v">{{ v.phone }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let v"><mat-chip [color]="v.status === 'active' ? 'primary' : undefined">{{ v.status }}</mat-chip></td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let v"><a mat-button color="primary" [routerLink]="['/admin/vendors', v.id]">Edit</a></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
