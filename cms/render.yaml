services:
  - type: web
    name: cms-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # --- Postgres connection (Neon or Supabase) — paste the full connection
      # string from your provider's dashboard, e.g.:
      # postgresql://user:pass@ep-xxxx.neon.tech/neondb?sslmode=require ---
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: 5   # both Neon and Supabase free tiers cap pooled connections; keep this modest
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: false
      # --- Auth secrets — generate your own random strings, don't reuse the repo's ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # --- CORS: must match the deployed frontend's exact URL, no trailing slash ---
      - key: CLIENT_ORIGIN
        sync: false
      # --- Optional: mail (leave blank to skip email sending) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: LOGIN_RATE_LIMIT_MAX
        value: 10
      - key: LOGIN_RATE_LIMIT_WINDOW_MIN
        value: 15

  - type: web
    name: cms-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build:prod
    staticPublishPath: dist/cms-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
